<!DOCTYPE html>
<html>
<head>
  <title>Gemini LeetCode Tracker</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 220px;
      padding: 15px;
      background-color: #f9f9f9;
      color: #333;
    }

    h3 {
      margin-bottom: 15px;
      text-align: center;
      color: #4A90E2;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #toggleSwitch {
      transform: scale(1.2);
    }

    #send {
      padding: 8px 12px;
      margin-top: 10px;
      border: none;
      border-radius: 5px;
      background-color: #4A90E2;
      color: white;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s ease;
    }

    #send:hover {
      background-color: #357ABD;
    }
  </style>
</head>
<body>
  <h3>Distraction Filter</h3>
  <div class="section">
    <div class="toggle-row">
      <span>Enabled</span>
      <input type="checkbox" id="toggleSwitch">
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
