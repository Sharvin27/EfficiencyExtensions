<!DOCTYPE html>
<html>
<head>
  <title>Gemini LeetCode Tracker</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 220px;
      padding: 15px;
      background-color: #f9f9f9;
      color: #333;
    }

    h3 {
      margin-bottom: 15px;
      text-align: center;
      color: #4A90E2;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #toggleSwitch {
      transform: scale(1.2);
    }

    #notepadBtn {
      width: 100%;
      border-radius: 5px;
      padding: 8px 0;
      background-color: #4A90E2;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #notepadBtn:hover {
      background-color: #357ABD;
    }

    #send {
      margin-top: 10px;
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      background-color: #4A90E2;
      color: white;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s ease;
    }

    #send:hover {
      background-color: #357ABD;
    }

    #notepadPanel {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: 50%;
      background: #fff;
      box-shadow: -2px 0 8px rgba(0,0,0,0.1);
      z-index: 1000;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
    }

    #intuitionInput {
      width: 100%;
      height: 120px;
      resize: none;
      border-radius: 5px;
      border: 1px solid #ccc;
      padding: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h3>Distraction Filter</h3>
  <div class="section">
    <div class="toggle-row">
      <span>Enabled</span>
      <input type="checkbox" id="toggleSwitch">
    </div>
    <div style="display: flex; width: 100%; gap: 10px;">
      <button id="notepadBtn" style="flex: 1; border-radius: 5px; padding: 8px 0; background-color: #4A90E2; color: white; font-weight: bold; border: none; cursor: pointer; transition: background-color 0.3s ease;">Notepad</button>
      <button id="leetcodeTableBtn" style="flex: 1; border-radius: 5px; padding: 8px 0; background-color: #7B61FF; color: white; font-weight: bold; border: none; cursor: pointer; transition: background-color 0.3s ease;">Leetcode Table</button>
    </div>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
